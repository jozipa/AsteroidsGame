<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids</title>
</head>

<body>
  <div id="game">
    <!-- Górny pasek (Speed + SCORE + LIVES) -->
    <div id="topBar">
      <div id="speedBox"><span id="speed">0</span></div>
      <div id="score">0</div>
      <div id="lives">Pozostałe życia: <a id="livesLeft">3</a></div>
    </div>

    <canvas id="app"></canvas>

    <!-- Komunikat Game Over -->
    <div id="gameOver">
      GAME OVER
      Score: <a id="score2"></a>
      <button id="restartButton">Restart Game</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>





</html>
